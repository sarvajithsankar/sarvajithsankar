name: Refresh profile activity

on:
  schedule:
    # Every 12 hours: 00:00 and 12:00 UTC.
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-profile-activity
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh README data
        env:
          PROFILE_USER: sarvajithsankar
          # Optional classic PAT with read:user. Add repo too if private
          # contributions should be included. Falls back to GITHUB_TOKEN.
          PROFILE_TOKEN: ${{ secrets.PROFILE_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_profile.py

      - name: Commit generated changes
        run: |
          if ! git status --porcelain -- README.md assets | grep -q .; then
            echo "No profile changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets
          git commit -m "chore: refresh profile activity data"
          git push
