name: Generate contribution snake

on:
  schedule:
    # Daily at 00:00 UTC.
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#00FFA3&color_dots=#0D1117,#0B2B22,#0E5F49,#00A87A,#00FFA3
            dist/snake-light.svg?color_snake=#059669&color_dots=#ebedf0,#d1fae5,#6ee7b7,#10b981,#059669

      - name: Publish SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
