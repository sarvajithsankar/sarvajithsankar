<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 840 252" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="bannerTitle bannerDesc">
  <title id="bannerTitle">Sarvajith Sankar — AI and Software Engineering</title>
  <desc id="bannerDesc">Autonomous Intelligence / Systems in Motion. Autonomous AI agents, LLM security middleware, and backend systems.</desc>

  <defs>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace; }
      @media (prefers-reduced-motion: reduce) {
        .motion { animation: none !important; }
      }
    </style>

    <linearGradient id="bgBase" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0E1A"/>
      <stop offset="0.55" stop-color="#0B1020"/>
      <stop offset="1" stop-color="#0D1117"/>
    </linearGradient>
    <linearGradient id="rightSheen" x1="0.55" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00D9FF" stop-opacity="0"/>
      <stop offset="1" stop-color="#00D9FF" stop-opacity="0.06"/>
    </linearGradient>

    <radialGradient id="glowName" cx="0.28" cy="0.42" r="0.42">
      <stop offset="0" stop-color="#00FFA3" stop-opacity="0.18"/>
      <stop offset="0.45" stop-color="#00FFA3" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#00FFA3" stop-opacity="0"/>
      <animate attributeName="cx" values="0.26;0.32;0.26" dur="22s" repeatCount="indefinite"/>
    </radialGradient>
    <radialGradient id="glowNet" cx="0.82" cy="0.48" r="0.38">
      <stop offset="0" stop-color="#00D9FF" stop-opacity="0.16"/>
      <stop offset="0.5" stop-color="#5577FF" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#00D9FF" stop-opacity="0"/>
      <animate attributeName="cy" values="0.46;0.54;0.46" dur="26s" repeatCount="indefinite"/>
    </radialGradient>
    <radialGradient id="glowViolet" cx="0.96" cy="0.12" r="0.28">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="coreFill" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#10382C"/>
      <stop offset="1" stop-color="#0B1020"/>
    </radialGradient>

    <linearGradient id="nameFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F4F7FB"/>
      <stop offset="0.55" stop-color="#E7F7FF"/>
      <stop offset="1" stop-color="#D8FFE9"/>
    </linearGradient>
    <linearGradient id="shimmer" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F4F7FB" stop-opacity="0"/>
      <stop offset="0.42" stop-color="#F4F7FB" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="0.58" stop-color="#C8FFE8" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#F4F7FB" stop-opacity="0"/>
      <animate attributeName="x1" values="-1.2;1" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="-0.2;2" dur="9s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="edgeAccent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00FFA3" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00FFA3" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#00FFA3" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="linkCyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00D9FF" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#00D9FF" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="linkGreen" x1="1" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#00FFA3" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#00FFA3" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="linkViolet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#F472B6" stop-opacity="0.45"/>
    </linearGradient>

    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#A7B4C8" stroke-width="0.4" stroke-opacity="0.09"/>
    </pattern>
    <linearGradient id="gridFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="0.48" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.85"/>
    </linearGradient>
    <mask id="gridMask">
      <rect width="840" height="252" fill="url(#gridFade)"/>
    </mask>

    <clipPath id="nameClip">
      <text x="32" y="126" font-family="ui-monospace, SFMono-Regular, Consolas, Liberation Mono, monospace" font-size="34" font-weight="700" letter-spacing="2.6">SARVAJITH SANKAR</text>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="840" height="252" fill="url(#bgBase)"/>
  <rect width="840" height="252" fill="url(#glowName)"/>
  <rect width="840" height="252" fill="url(#glowNet)"/>
  <rect width="840" height="252" fill="url(#glowViolet)"/>
  <rect width="840" height="252" fill="url(#rightSheen)"/>
  <rect width="840" height="252" fill="url(#grid)" mask="url(#gridMask)"/>
  <rect x="0" y="0" width="2" height="252" fill="url(#edgeAccent)"/>

  <g opacity="0.35">
    <circle cx="92" cy="44" r="0.9" fill="#00FFA3"/>
    <circle cx="214" cy="214" r="0.8" fill="#00D9FF"/>
    <circle cx="448" cy="38" r="0.7" fill="#8B5CF6"/>
    <circle cx="392" cy="228" r="0.8" fill="#A7B4C8"/>
    <circle cx="508" cy="120" r="0.7" fill="#00D9FF"/>
    <circle cx="802" cy="232" r="0.9" fill="#00FFA3"/>
  </g>

  <rect class="motion" x="0" y="0" width="840" height="1.1" fill="#00D9FF" opacity="0.07">
    <animate attributeName="y" values="-4;252" dur="16s" repeatCount="indefinite"/>
  </rect>

  <!-- Identity -->
  <g class="mono">
    <g font-size="8" letter-spacing="1.8">
      <circle cx="38" cy="28" r="2.4" fill="#00FFA3">
        <animate attributeName="opacity" values="0.45;1;0.45" dur="3.2s" repeatCount="indefinite"/>
      </circle>
      <text x="46" y="31" fill="#62748A">SYSTEM ONLINE</text>
    </g>

    <text x="32" y="86" font-size="11" letter-spacing="2.4">
      <tspan fill="#00FFA3">//</tspan>
      <tspan fill="#A7B4C8"> AI &amp; SOFTWARE ENGINEERING</tspan>
    </text>
    <rect x="292" y="76" width="6" height="12" fill="#00FFA3" opacity="0.85">
      <animate attributeName="opacity" values="0.85;0.12;0.85" dur="1.2s" repeatCount="indefinite"/>
    </rect>

    <text x="32" y="126" font-family="ui-monospace, SFMono-Regular, Consolas, Liberation Mono, monospace" font-size="34" font-weight="700" letter-spacing="2.6" fill="url(#nameFill)">SARVAJITH SANKAR</text>
    <rect x="32" y="96" width="430" height="40" fill="url(#shimmer)" clip-path="url(#nameClip)"/>
    <rect x="32" y="138" width="196" height="1.15" fill="#00FFA3" opacity="0.45"/>

    <text x="32" y="164" font-size="11.5" letter-spacing="0.4" fill="#A7B4C8">Autonomous AI agents · LLM security middleware · Backend systems</text>
  </g>

  <!-- Agent network -->
  <g class="mono">
    <rect x="508" y="36" width="300" height="180" rx="10" fill="#101827" fill-opacity="0.28" stroke="#1B2A3A" stroke-width="0.9"/>
    <path d="M516 44h10M516 44v10" fill="none" stroke="#00FFA3" stroke-opacity="0.45" stroke-width="1"/>
    <path d="M800 44h-10M800 44v10" fill="none" stroke="#00D9FF" stroke-opacity="0.4" stroke-width="1"/>
    <path d="M516 208h10M516 208v-10" fill="none" stroke="#00D9FF" stroke-opacity="0.35" stroke-width="1"/>
    <path d="M800 208h-10M800 208v-10" fill="none" stroke="#8B5CF6" stroke-opacity="0.4" stroke-width="1"/>
    <text x="658" y="52" text-anchor="middle" font-size="7" letter-spacing="1.6" fill="#62748A">AUTONOMOUS AGENT GRAPH</text>

    <g fill="none" stroke-width="1.05" stroke-dasharray="3.5 4.5" stroke-linecap="round">
      <path d="M665 126 L548 60" stroke="url(#linkGreen)" stroke-opacity="0.9"/>
      <path d="M665 126 L771 56" stroke="url(#linkCyan)"/>
      <path d="M665 126 L551 198" stroke="url(#linkViolet)"/>
      <path d="M665 126 L774 196" stroke="url(#linkCyan)" stroke-opacity="0.85"/>
    </g>

    <circle r="2.1" fill="#00FFA3">
      <animateMotion dur="4.4s" repeatCount="indefinite" path="M665 126 L548 60"/>
    </circle>
    <circle r="2.1" fill="#00D9FF">
      <animateMotion dur="5.1s" begin="-1.2s" repeatCount="indefinite" path="M771 56 L665 126"/>
    </circle>
    <circle r="2" fill="#F472B6">
      <animateMotion dur="4.8s" begin="-2.1s" repeatCount="indefinite" path="M665 126 L551 198"/>
    </circle>
    <circle r="2.1" fill="#8B5CF6">
      <animateMotion dur="5.6s" begin="-0.7s" repeatCount="indefinite" path="M774 196 L665 126"/>
    </circle>

    <g transform="translate(665 126)">
      <circle r="36" fill="none" stroke="#00FFA3" stroke-opacity="0.08"/>
      <circle r="28" fill="none" stroke="#00D9FF" stroke-opacity="0.18" stroke-dasharray="2 7">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="22s" repeatCount="indefinite"/>
      </circle>
      <circle r="18" fill="url(#coreFill)" stroke="#00FFA3" stroke-opacity="0.7" stroke-width="1.2"/>
      <circle r="3.2" fill="#00FFA3">
        <animate attributeName="opacity" values="0.45;1;0.45" dur="3s" repeatCount="indefinite"/>
      </circle>
      <text y="44" text-anchor="middle" font-size="7" letter-spacing="1.4" fill="#A7B4C8">AGENT CORE</text>
    </g>

    <!-- MCP -->
    <g>
      <rect x="522" y="50" width="52" height="20" rx="5" fill="#0D1117" stroke="#00FFA3" stroke-opacity="0.55"/>
      <circle cx="531" cy="60" r="2.1" fill="#00FFA3">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2.8s" repeatCount="indefinite"/>
      </circle>
      <text x="548" y="64" text-anchor="middle" font-size="8" letter-spacing="1.1" fill="#F4F7FB">MCP</text>
    </g>
    <!-- TAVILY -->
    <g>
      <rect x="740" y="46" width="62" height="20" rx="5" fill="#0D1117" stroke="#00D9FF" stroke-opacity="0.55"/>
      <circle cx="749" cy="56" r="2.1" fill="#00D9FF">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="3.4s" begin="-0.8s" repeatCount="indefinite"/>
      </circle>
      <text x="774" y="60" text-anchor="middle" font-size="8" letter-spacing="0.8" fill="#F4F7FB">TAVILY</text>
    </g>
    <!-- SYNTHESIZE -->
    <g>
      <rect x="508" y="188" width="86" height="20" rx="5" fill="#0D1117" stroke="#F472B6" stroke-opacity="0.55"/>
      <circle cx="517" cy="198" r="2.1" fill="#F472B6">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="3.1s" begin="-1.4s" repeatCount="indefinite"/>
      </circle>
      <text x="555" y="202" text-anchor="middle" font-size="8" letter-spacing="0.6" fill="#F4F7FB">SYNTHESIZE</text>
    </g>
    <!-- ARXIV -->
    <g>
      <rect x="746" y="186" width="56" height="20" rx="5" fill="#0D1117" stroke="#8B5CF6" stroke-opacity="0.55"/>
      <circle cx="755" cy="196" r="2.1" fill="#8B5CF6">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="3.6s" begin="-2s" repeatCount="indefinite"/>
      </circle>
      <text x="777" y="200" text-anchor="middle" font-size="8" letter-spacing="0.9" fill="#F4F7FB">ARXIV</text>
    </g>

    <text x="590" y="88" font-size="6.5" letter-spacing="1.2" fill="#62748A">TOOL ROUTING</text>
    <text x="690" y="88" font-size="6.5" letter-spacing="1.2" fill="#62748A">CONTEXT FLOW</text>
    <text x="658" y="214" text-anchor="middle" font-size="6.5" letter-spacing="1.2" fill="#62748A">LIVE TELEMETRY</text>
  </g>

  <text x="32" y="240" class="mono" font-size="9" fill="#62748A">github.com/sarvajithsankar</text>
</svg>
