<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">Sarvajith Sankar — AI/ML developer and computer science undergraduate</title>
  <desc id="heroDesc">Sarvajith Sankar builds with AI to understand how intelligent systems work, from the model down to the infrastructure. VIT Vellore, IIT Madras, India.</desc>

  <defs>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .sans { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .serif { font-family: Georgia, "Times New Roman", serif; }
      .orbit-slow { transform-box: fill-box; transform-origin: center; animation: orbit 140s linear infinite; }
      .orbit-reverse { transform-box: fill-box; transform-origin: center; animation: orbit-reverse 95s linear infinite; }
      .core-pulse { animation: pulse 6s ease-in-out infinite; }
      .node-a { animation: fade 7s ease-in-out infinite; }
      .node-b { animation: fade 9s ease-in-out infinite 1.4s; }
      .node-c { animation: fade 8s ease-in-out infinite 2.8s; }
      .status-dot { animation: pulse 4s ease-in-out infinite; }
      @keyframes orbit { to { transform: rotate(360deg); } }
      @keyframes orbit-reverse { to { transform: rotate(-360deg); } }
      @keyframes pulse { 0%, 100% { opacity: 0.55; } 50% { opacity: 1; } }
      @keyframes fade { 0%, 100% { opacity: 0.35; } 50% { opacity: 0.9; } }
      @media (prefers-reduced-motion: reduce) {
        .orbit-slow, .orbit-reverse, .core-pulse, .node-a, .node-b, .node-c, .status-dot { animation: none !important; }
      }
    </style>

    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080810"/>
      <stop offset="0.52" stop-color="#0B1020"/>
      <stop offset="1" stop-color="#15102E"/>
    </linearGradient>

    <linearGradient id="bottomLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#8B5CF6" stop-opacity="0.85"/>
      <stop offset="0.58" stop-color="#6366F1" stop-opacity="0.65"/>
      <stop offset="0.8" stop-color="#22D3EE" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E5E7EB"/>
      <stop offset="0.48" stop-color="#F5F3FF"/>
      <stop offset="0.78" stop-color="#C4B5FD"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>

    <linearGradient id="ruleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#24134A" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#24134A" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="orbitStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#6366F1" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0.45"/>
    </linearGradient>

    <radialGradient id="violetGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.24"/>
      <stop offset="0.55" stop-color="#6366F1" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="indigoGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6366F1" stop-opacity="0.2"/>
      <stop offset="0.6" stop-color="#24134A" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="cyanGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="coreGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.34"/>
      <stop offset="0.45" stop-color="#6366F1" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="coreFill" cx="0.35" cy="0.3" r="0.85">
      <stop offset="0" stop-color="#24134A"/>
      <stop offset="0.6" stop-color="#15102E"/>
      <stop offset="1" stop-color="#0B1020"/>
    </radialGradient>

    <radialGradient id="vignette" cx="0.5" cy="0.45" r="0.75">
      <stop offset="0.45" stop-color="#080810" stop-opacity="0"/>
      <stop offset="1" stop-color="#080810" stop-opacity="0.55"/>
    </radialGradient>

    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#8B5CF6" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>

    <filter id="nameShadow" x="-10%" y="-30%" width="120%" height="180%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10" result="blur"/>
      <feOffset dx="0" dy="6" result="offset"/>
      <feFlood flood-color="#8B5CF6" flood-opacity="0.3"/>
      <feComposite in2="offset" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect width="1200" height="420" fill="url(#grid)"/>

  <ellipse cx="290" cy="140" rx="430" ry="285" fill="url(#violetGlow)"/>
  <ellipse cx="1010" cy="272" rx="390" ry="305" fill="url(#indigoGlow)"/>
  <ellipse cx="1110" cy="30" rx="250" ry="175" fill="url(#cyanGlow)"/>

  <g class="sans">
    <line x1="80" y1="64" x2="188" y2="64" stroke="url(#ruleGrad)" stroke-width="1.5"/>
    <text x="80" y="96" class="mono" font-size="11.5" letter-spacing="3.1" fill="#22D3EE" fill-opacity="0.9">AI / ML · AGENTS · INFRASTRUCTURE</text>

    <text x="74" y="190" font-size="67" font-weight="700" letter-spacing="-1.8" fill="url(#nameGrad)" filter="url(#nameShadow)">SARVAJITH SANKAR</text>

    <text x="80" y="236" font-size="20" font-weight="500" fill="#E5E7EB" fill-opacity="0.92">AI/ML Developer <tspan fill="#8B5CF6">·</tspan> <tspan fill="#9294A5">CS Undergraduate</tspan></text>

    <text x="80" y="270" class="serif" font-size="18" font-style="italic" fill="#9294A5">Learning by building. Exploring by experimenting.</text>

    <text x="80" y="310" font-size="15" fill="#9294A5" fill-opacity="0.9">Building with AI to understand how intelligent systems work —</text>
    <text x="80" y="332" font-size="15" fill="#9294A5" fill-opacity="0.9">from the model down to the infrastructure.</text>
  </g>

  <g transform="translate(960 205)">
    <circle r="132" fill="url(#coreGlow)"/>

    <g class="orbit-slow">
      <ellipse rx="228" ry="82" transform="rotate(-18)" fill="none" stroke="url(#orbitStroke)" stroke-width="1.2"/>
      <ellipse rx="172" ry="60" transform="rotate(24)" fill="none" stroke="#6366F1" stroke-opacity="0.2" stroke-width="1"/>
    </g>
    <g class="orbit-reverse">
      <ellipse rx="116" ry="40" transform="rotate(-6)" fill="none" stroke="#22D3EE" stroke-opacity="0.22" stroke-width="1"/>
      <ellipse rx="286" ry="104" transform="rotate(10)" fill="none" stroke="#8B5CF6" stroke-opacity="0.12" stroke-width="1" stroke-dasharray="2 9"/>
    </g>

    <path d="M -210 25 L -150 -40 L -60 30 L 40 62" fill="none" stroke="#6366F1" stroke-opacity="0.16" stroke-width="1" stroke-dasharray="2 7"/>
    <path d="M 90 -55 L 185 10 L 40 62" fill="none" stroke="#8B5CF6" stroke-opacity="0.16" stroke-width="1" stroke-dasharray="2 7"/>

    <circle r="43" fill="url(#coreFill)" stroke="#8B5CF6" stroke-opacity="0.32" stroke-width="1.2"/>
    <circle r="18" fill="none" stroke="#8B5CF6" stroke-opacity="0.18" stroke-width="1"/>
    <circle r="8.5" fill="#22D3EE" fill-opacity="0.9" class="core-pulse"/>
    <circle r="3" fill="#E5E7EB"/>

    <g class="node-a">
      <circle cx="-150" cy="-40" r="8" fill="#8B5CF6" fill-opacity="0.14"/>
      <circle cx="-150" cy="-40" r="3" fill="#A78BFA"/>
    </g>
    <g class="node-b">
      <circle cx="90" cy="-55" r="8" fill="#6366F1" fill-opacity="0.14"/>
      <circle cx="90" cy="-55" r="3" fill="#22D3EE"/>
    </g>
    <g class="node-c">
      <circle cx="185" cy="10" r="8" fill="#22D3EE" fill-opacity="0.12"/>
      <circle cx="185" cy="10" r="2.6" fill="#22D3EE"/>
    </g>
    <g class="node-a">
      <circle cx="-210" cy="25" r="7" fill="#8B5CF6" fill-opacity="0.12"/>
      <circle cx="-210" cy="25" r="2.4" fill="#8B5CF6"/>
    </g>
    <g class="node-b">
      <circle cx="40" cy="62" r="7" fill="#6366F1" fill-opacity="0.12"/>
      <circle cx="40" cy="62" r="2.4" fill="#A78BFA"/>
    </g>

    <circle cx="235" cy="-48" r="1.7" fill="#A78BFA" fill-opacity="0.55" class="node-c"/>
    <circle cx="-245" cy="-62" r="1.5" fill="#22D3EE" fill-opacity="0.45" class="node-a"/>
    <circle cx="200" cy="92" r="1.4" fill="#6366F1" fill-opacity="0.5" class="node-b"/>
  </g>

  <g class="sans">
    <line x1="80" y1="366" x2="700" y2="366" stroke="url(#ruleGrad)" stroke-width="1"/>
    <text x="80" y="393" class="mono" font-size="10.5" letter-spacing="1.6" fill="#9294A5">VIT VELLORE <tspan fill="#8B5CF6">·</tspan> IIT MADRAS</text>
    <circle cx="260" cy="389" r="2" fill="#8B5CF6" fill-opacity="0.7"/>
    <text x="278" y="393" class="mono" font-size="10.5" letter-spacing="1.6" fill="#9294A5">INDIA</text>
    <circle cx="338" cy="389" r="2" fill="#8B5CF6" fill-opacity="0.7"/>
    <circle cx="360" cy="389" r="3" fill="#22D3EE" fill-opacity="0.85" class="status-dot"/>
    <text x="372" y="393" class="mono" font-size="10.5" letter-spacing="1.6" fill="#22D3EE" fill-opacity="0.8">OPEN TO INTERNSHIPS</text>
  </g>

  <rect width="1200" height="420" fill="url(#vignette)"/>
  <rect x="0" y="418" width="1200" height="2" fill="url(#bottomLine)"/>
</svg>
