<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">Sarvajith Sankar — AI/ML developer and computer science undergraduate</title>
  <desc id="heroDesc">Sarvajith Sankar builds intelligent systems and AI agents, from the model down to the infrastructure. BTech CSE at VIT Vellore, BS Data Science at IIT Madras. Open to internships.</desc>

  <defs>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .sans { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .serif { font-family: Georgia, "Times New Roman", serif; }
      .pulse { animation: pulse 4.5s ease-in-out infinite; }
      .ring { transform-box: fill-box; transform-origin: center; animation: spin 120s linear infinite; }
      .ring-reverse { transform-box: fill-box; transform-origin: center; animation: spin-reverse 150s linear infinite; }
      @keyframes pulse { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes spin-reverse { to { transform: rotate(-360deg); } }
      @media (prefers-reduced-motion: reduce) {
        .pulse, .ring, .ring-reverse { animation: none !important; }
      }
    </style>

    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBFCFE"/>
      <stop offset="0.55" stop-color="#F4F7FB"/>
      <stop offset="1" stop-color="#EEF3F9"/>
    </linearGradient>

    <linearGradient id="nameFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="0.62" stop-color="#1E293B"/>
      <stop offset="0.86" stop-color="#065F46"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>

    <linearGradient id="ruleFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#059669" stop-opacity="0.65"/>
      <stop offset="0.45" stop-color="#0891B2" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="cardRule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#059669"/>
      <stop offset="0.55" stop-color="#0891B2"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>

    <radialGradient id="mintHalo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#059669" stop-opacity="0.13"/>
      <stop offset="0.55" stop-color="#0891B2" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#059669" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="violetHalo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="cyanHalo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#0891B2" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#0891B2" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="cardGlass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F8FAFC"/>
    </linearGradient>

    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M 64 0 L 0 0 0 64" fill="none" stroke="#0F172A" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="400" fill="url(#sky)"/>
  <rect width="1200" height="400" fill="url(#grid)"/>
  <ellipse cx="150" cy="30" rx="560" ry="300" fill="url(#mintHalo)"/>
  <ellipse cx="1040" cy="80" rx="380" ry="270" fill="url(#violetHalo)"/>
  <ellipse cx="1120" cy="390" rx="420" ry="300" fill="url(#cyanHalo)"/>

  <g stroke="#059669" stroke-opacity="0.32" stroke-width="1.5" fill="none">
    <path d="M 32 64 L 32 32 L 64 32"/>
    <path d="M 1168 336 L 1168 368 L 1136 368"/>
  </g>

  <g class="sans">
    <rect x="88" y="70" width="7" height="7" transform="rotate(45 91.5 73.5)" fill="#059669" class="pulse"/>
    <text x="108" y="78" class="mono" font-size="11" letter-spacing="3" fill="#047857">AI / ML · AGENTIC SYSTEMS · INFRASTRUCTURE</text>

    <text x="84" y="180" font-size="64" font-weight="700" letter-spacing="-1.6" fill="url(#nameFill)">SARVAJITH SANKAR</text>

    <text x="88" y="218" font-size="20" font-weight="500" fill="#0F172A">AI/ML Developer <tspan fill="#059669">·</tspan> <tspan fill="#475569" font-weight="400">CS Undergraduate</tspan></text>

    <text x="88" y="252" class="serif" font-size="17.5" font-style="italic" fill="#475569">Learning by building. Exploring by experimenting.</text>

    <text x="88" y="290" font-size="14.5" fill="#475569">Building intelligent systems end to end — from the model and the agent loop</text>
    <text x="88" y="311" font-size="14.5" fill="#475569">down to the infrastructure that keeps them running.</text>
  </g>

  <g class="sans">
    <line x1="88" y1="338" x2="760" y2="338" stroke="url(#ruleFade)" stroke-width="1"/>
    <text x="88" y="366" class="mono" font-size="10.5" letter-spacing="1.8" fill="#475569">VIT VELLORE <tspan fill="#059669">·</tspan> IIT MADRAS <tspan fill="#059669">·</tspan> INDIA</text>
    <circle cx="404" cy="362" r="3" fill="#059669" class="pulse"/>
    <text x="416" y="366" class="mono" font-size="10.5" letter-spacing="1.8" fill="#047857">OPEN TO INTERNSHIPS</text>
  </g>

  <g transform="translate(966 196)">
    <circle r="150" fill="url(#mintHalo)"/>
    <circle r="196" fill="none" stroke="#059669" stroke-opacity="0.14" stroke-width="1"/>
    <circle r="238" fill="none" stroke="#0891B2" stroke-opacity="0.1" stroke-width="1" stroke-dasharray="2 10"/>

    <g class="ring">
      <ellipse rx="244" ry="90" transform="rotate(-16)" fill="none" stroke="#059669" stroke-opacity="0.4" stroke-width="1.1"/>
      <circle cx="222" cy="-44" r="3" fill="#059669"/>
      <circle cx="-238" cy="18" r="2.4" fill="#0891B2"/>
    </g>
    <g class="ring-reverse">
      <ellipse rx="198" ry="70" transform="rotate(20)" fill="none" stroke="#0891B2" stroke-opacity="0.3" stroke-width="1"/>
      <ellipse rx="156" ry="54" transform="rotate(-4)" fill="none" stroke="#7C3AED" stroke-opacity="0.28" stroke-width="1" stroke-dasharray="3 8"/>
      <circle cx="150" cy="26" r="2.6" fill="#7C3AED"/>
    </g>

    <path d="M -196 -70 L -96 -18 L 8 34" fill="none" stroke="#0891B2" stroke-opacity="0.22" stroke-width="1" stroke-dasharray="2 7"/>
    <path d="M 196 72 L 96 18 L -8 -30" fill="none" stroke="#7C3AED" stroke-opacity="0.2" stroke-width="1" stroke-dasharray="2 7"/>

    <rect x="-176" y="-96" width="356" height="200" rx="14" fill="#0F172A" fill-opacity="0.06"/>
    <rect x="-178" y="-100" width="356" height="200" rx="14" fill="url(#cardGlass)" stroke="#E2E8F0" stroke-width="1"/>
    <rect x="-178" y="-100" width="356" height="2" rx="1" fill="url(#cardRule)"/>

    <circle cx="-156" cy="-80" r="3.4" fill="#059669"/>
    <circle cx="-144" cy="-80" r="3.4" fill="#0891B2"/>
    <circle cx="-132" cy="-80" r="3.4" fill="#7C3AED"/>
    <text x="-116" y="-76" class="mono" font-size="9.5" letter-spacing="0.8" fill="#64748B">agent://tenet-runtime</text>
    <rect x="122" y="-88" width="40" height="16" rx="8" fill="#059669" fill-opacity="0.08" stroke="#059669" stroke-opacity="0.35" stroke-width="0.8"/>
    <circle cx="132" cy="-80" r="2.4" fill="#059669" class="pulse"/>
    <text x="138" y="-76.5" class="mono" font-size="7.5" letter-spacing="1" fill="#047857">READY</text>
    <line x1="-178" y1="-62" x2="178" y2="-62" stroke="#E2E8F0" stroke-width="1"/>

    <g class="mono" font-size="11">
      <text x="-158" y="-38" fill="#047857">&gt;</text>
      <text x="-146" y="-38" fill="#0F172A">tenet.guard(prompt)</text>
      <text x="-158" y="-14" fill="#64748B">injection</text>
      <text x="-58" y="-14" fill="#0F172A">clear</text>
      <text x="-20" y="-14" fill="#059669">✓</text>
      <text x="-158" y="10" fill="#64748B">jailbreak</text>
      <text x="-58" y="10" fill="#0F172A">clear</text>
      <text x="-20" y="10" fill="#059669">✓</text>
      <text x="-158" y="34" fill="#64748B">memory</text>
      <text x="-58" y="34" fill="#0891B2">persistent</text>
      <text x="-158" y="58" fill="#64748B">verdict</text>
      <text x="-58" y="58" fill="#059669">allow</text>
      <text x="146" y="58" fill="#7C3AED" text-anchor="end">audit</text>
    </g>

    <line x1="-178" y1="70" x2="178" y2="70" stroke="#E2E8F0" stroke-width="1"/>
    <g class="mono" font-size="8" letter-spacing="1" fill="#64748B">
      <text x="-158" y="86">LANGGRAPH</text>
      <text x="-74" y="86">MCP</text>
      <text x="-14" y="86">FASTAPI</text>
      <text x="70" y="86">REDIS</text>
      <text x="132" y="86">PG</text>
    </g>
    <circle cx="-104" cy="82" r="1.6" fill="#059669"/>
    <circle cx="-44" cy="82" r="1.6" fill="#059669"/>
    <circle cx="28" cy="82" r="1.6" fill="#059669"/>
    <circle cx="106" cy="82" r="1.6" fill="#059669"/>
    <circle cx="156" cy="82" r="1.6" fill="#059669"/>
  </g>

  <rect x="0" y="398" width="1200" height="2" fill="url(#cardRule)" fill-opacity="0.45"/>
</svg>
