<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="104" viewBox="0 0 1000 104" role="img" aria-labelledby="footerTitle">
  <title id="footerTitle">Sarvajith Sankar — AI/ML, India, learning by building</title>

  <defs>
    <linearGradient id="footerRule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0"/>
      <stop offset="0.28" stop-color="#8B5CF6" stop-opacity="0.5"/>
      <stop offset="0.5" stop-color="#6366F1" stop-opacity="0.7"/>
      <stop offset="0.72" stop-color="#22D3EE" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .dot { animation: pulse 5s ease-in-out infinite; }
      @keyframes pulse { 0%, 100% { opacity: 0.45; } 50% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { .dot { animation: none !important; } }
    </style>
  </defs>

  <line x1="80" y1="12" x2="920" y2="12" stroke="url(#footerRule)" stroke-width="1"/>
  <circle cx="80" cy="12" r="2" fill="#8B5CF6" fill-opacity="0.6"/>
  <circle cx="920" cy="12" r="2" fill="#22D3EE" fill-opacity="0.55"/>

  <rect x="496" y="8" width="8" height="8" rx="1" transform="rotate(45 500 12)" fill="#22D3EE" fill-opacity="0.85" class="dot"/>

  <text x="500" y="52" text-anchor="middle" class="mono" font-size="11" letter-spacing="3.6" fill="#9294A5">SARVAJITH SANKAR</text>
  <text x="500" y="74" text-anchor="middle" class="mono" font-size="9" letter-spacing="2.2" fill="#9294A5" fill-opacity="0.62">AI/ML · INDIA · LEARNING BY BUILDING</text>
</svg>
