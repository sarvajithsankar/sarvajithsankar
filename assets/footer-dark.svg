<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="96" viewBox="0 0 1000 96" role="img" aria-labelledby="footerTitle">
  <title id="footerTitle">Sarvajith Sankar — AI/ML, India, learning by building</title>

  <defs>
    <linearGradient id="footerRule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00FFA3" stop-opacity="0"/>
      <stop offset="0.28" stop-color="#00FFA3" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#00D9FF" stop-opacity="0.7"/>
      <stop offset="0.72" stop-color="#A855F7" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#A855F7" stop-opacity="0"/>
    </linearGradient>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
