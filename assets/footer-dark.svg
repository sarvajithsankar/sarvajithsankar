  <rect x="496" y="10" width="8" height="8" rx="1" transform="rotate(45 500 14)" fill="#00FFA3" class="dot"/>

  <text x="500" y="50" text-anchor="middle" class="mono" font-size="11" letter-spacing="3.8" fill="#94A3B8">SARVAJITH SANKAR</text>
  <text x="500" y="70" text-anchor="middle" class="mono" font-size="8.5" letter-spacing="2.4" fill="#64748B" fill-opacity="0.85">AI/ML · INDIA · LEARNING BY BUILDING</text>
